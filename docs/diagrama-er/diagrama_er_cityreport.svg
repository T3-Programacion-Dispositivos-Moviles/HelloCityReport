<text x="760" y="632" font-size="16" fill="#156082" font-weight="700">Reglas del modelo</text>
<text x="760" y="660" font-size="13.5" fill="#222">• Un usuario reporta cero o muchas incidencias; cada incidencia pertenece a un solo usuario.</text>
<text x="760" y="686" font-size="13.5" fill="#222">• Una categoría clasifica cero o muchas incidencias; cada incidencia tiene una sola categoría.</text>
<text x="760" y="712" font-size="13.5" fill="#222">• estado: PENDIENTE | EN_PROCESO | RESUELTO (enum Estado).  rol: CIUDADANO | ADMIN.</text>
<text x="760" y="738" font-size="13.5" fill="#222">• Las fechas se guardan como INTEGER (milisegundos desde 1970).</text>
<text x="760" y="764" font-size="13.5" fill="#222">• CATEGORIA se precarga con 5 registros: BACHE, LUMINARIA, BASURA, FUGA_AGUA y OTRO.</text>
